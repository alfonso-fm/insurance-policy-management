<!-- ====== DEBUG (puedes quitar luego) ====== -->
<details style="margin-bottom: 16px;">
  <summary>Debug policies</summary>
  <pre>{{ form.getRawValue() | json }}</pre>
</details>

<div class="policy-container">
  <h2>{{ isEditMode ? 'Edit Policy' : 'Create Policy' }}</h2>

  <form [formGroup]="form" (ngSubmit)="save()">

    <div class="form-group">
      <label>Type</label>
      <select formControlName="type">
        <option value="1">Life</option>
        <option value="2">Auto</option>
        <option value="3">Health</option>
        <option value="4">Home</option>
      </select>
    </div>

    <div class="form-group">
      <label>Policy Number</label>
      <input type="text" formControlName="id">
    </div>

    <div class="form-group">
      <label>Client</label>

      <select
        formControlName="clientId"
        [class.invalid]="isInvalid('clientId')">

        <option value="">Select a client</option>

        <option *ngFor="let client of clients"
                [value]="client.id">
          {{ client.name }}
        </option>
      </select>

      <small class="error" *ngIf="isInvalid('clientId')">
        Client is required
      </small>
    </div>

    <div class="form-group">
      <label>Start Date</label>
      <input type="date" formControlName="validityStartDate">
    </div>

    <div class="form-group">
      <label>End Date</label>
      <input type="date" formControlName="validityEndDate">
    </div>
    <div class="error"
        *ngIf="isDateRangeInvalid && form.touched">
      End date must be greater than start date
    </div>
    <div class="form-group">
      <label>Amount</label>
      <input type="number" formControlName="amount">
    </div>

    <div class="form-group">
      <label>Status</label>
      <select formControlName="status">
        <option value="1">Active</option>
        <option value="2">Inactive</option>
      </select>
    </div>

    <div class="actions">
      <button type="submit" class="btn-primary">
        {{ isEditMode ? 'Update Policy' : 'Create Policy' }}
      </button>
      <button type="button" class="btn-secondary" routerLink="/policies">
        Cancel
      </button>
    </div>

  </form>
</div>
