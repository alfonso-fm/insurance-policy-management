<h2>{{ clientId ? 'Edit Client' : 'New Client' }}</h2>

<form [formGroup]="form" (ngSubmit)="save()">

  <input placeholder="Identification Number" formControlName="NumericId" />
  <div *ngIf="form.controls.NumericId.invalid && form.controls.NumericId.touched">
    Must be 10 numeric digits
  </div>

  <input placeholder="Full Name" formControlName="Name" />
  <div *ngIf="form.controls.Name.invalid && form.controls.Name.touched">
    Only letters and spaces allowed
  </div>

  <input placeholder="Email" formControlName="email" />
  <div *ngIf="form.controls.email.invalid && form.controls.email.touched">
    Invalid email
  </div>

  <input placeholder="Phone" formControlName="phone" />

  <button type="submit" [disabled]="form.invalid">Save</button>
</form>
