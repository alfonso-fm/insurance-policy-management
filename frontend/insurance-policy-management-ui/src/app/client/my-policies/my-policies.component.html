<p>my-policies works!</p>
<h2>My Policies</h2>

<table>
  <tr>
    <th>Type</th>
    <th>Status</th>
    <th>Amount</th>
    <th>Actions</th>
  </tr>

  <tr *ngFor="let policy of policies">
    <td>{{ policy.type }}</td>
    <td>{{ policy.status }}</td>
    <td>{{ policy.amount }}</td>
    <td>
      <button
        *ngIf="policy.status === 'Active'"
        (click)="cancelPolicy(policy.id)">
        Cancel
      </button>
    </td>
  </tr>
</table>
